<div class="container mt-5">

<h3>
Recent IVR Transactions
</h3>


<table class="table table-striped mt-3">


<thead>

<tr>

<th>
Transaction ID
</th>

<th>
Customer
</th>

<th>
Status
</th>

<th>
Date
</th>

</tr>

</thead>



<tbody>

@for(item of transactions; track item.transactionId){

<tr>

<td>{{item.transactionId}}</td>
<td>{{item.customer}}</td>
<td>{{item.status}}</td>
<td>{{item.date}}</td>

</tr>

}


</tbody>


</table>


</div>
